<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard | Team 3291</title>

    <!-- CSS Imports -->
    <link rel="stylesheet" href="/css/main.css">
    <link rel="stylesheet" href="/css/admin/dashboard/robots.css">
</head>
<body>
    <h1>Admin Dashboard</h1>
    
    <dialog id="addRobotModal">
        <form id="robotForm">
            <div class="inputs">
                <div class="text-inputs">
                    <input type="text" id="name" placeholder="Robot Name" required>
                    <input type="number" id="year" placeholder="Year" required>

                    <div class="league-toggle">
                        <input type="radio" id="frc" name="season" value="FRC" checked>
                        <label for="frc">FRC</label>

                        <input type="radio" id="ftc" name="season" value="FTC">
                        <label for="ftc">FTC</label>
                    </div>

                    <textarea id="description" placeholder="Description" required></textarea>
                    <input type="url" id="githubLink" placeholder="GitHub URL">
                </div>

                <div class="file-inputs">
                    <div class="field-group">
                        <span class="field-label">Robot Image (.png)</span>
                        <label for="imageFile" class="drop-zone" id="imageDropZone">
                            <input type="file" id="imageFile" accept=".png" required />
                            <span class="drop-zone-text">Drop image here or click to upload</span>
                            <div class="preview-img"></div>
                        </label>
                    </div>

                    <div class="field-group">
                        <span class="field-label">3D Model (.glb)</span>
                        <label for="modelFile" class="drop-zone" id="modelDropZone">
                            <input type="file" id="modelFile" accept=".glb" required />
                            <span class="drop-zone-text">Drop 3D model here or click to upload</span>
                            <div class="preview-img"></div>
                        </label>
                    </div>
                </div>
            </div>
            <div class="btns">
                <button type="submit" id="submitBtn">Save Robot</button>
                <button type="button" id="closeRobotModalBtn">Cancel</button>
            </div>
        </form>
    </dialog>

    <div class="robot-display">
        <div class="control-bar">
            <p>Number of Robots: <span id="robotCount">0</span></p>
            <input type="text" id="searchInput" placeholder="Search Robots..." />
            <div class="btns">
                <button id="addRobotBtn" class="btn">
                    <svg xmlns="http://www.w3.org/2000/svg" height="24px" viewBox="0 -960 960 960" width="24px" fill="#e3e3e3"><path d="M440-440H200v-80h240v-240h80v240h240v80H520v240h-80v-240Z"/></svg>
                    Add New Robot
                </button>
                <button id="robotRefreshBtn" class="btn">
                    <svg xmlns="http://www.w3.org/2000/svg" height="24px" viewBox="0 -960 960 960" width="24px" fill="#e3e3e3"><path d="M480-160q-134 0-227-93t-93-227q0-134 93-227t227-93q69 0 132 28.5T720-690v-110h80v280H520v-80h168q-32-56-87.5-88T480-720q-100 0-170 70t-70 170q0 100 70 170t170 70q77 0 139-44t87-116h84q-28 106-114 173t-196 67Z"/></svg>
                    Refresh Robots
                </button>
            </div>
        </div>
        <div id="robot-container"></div>
    </div>

    
    <script type="module" src="/js/admin/dashboard/uploads.js"></script>
    <script type="module" src="/js/admin/dashboard/robots.js"></script>
</body>
</html>
