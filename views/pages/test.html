<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        /* --- Form Container --- */
#robotForm {
    background-color: #ffffff;
    border: 1px solid #e0e0e0;
    border-radius: 12px;
    padding: 2rem;
    max-width: 850px;
    margin: 2rem auto;
    box-shadow: 0 4px 6px rgba(0, 0, 0, 0.05);
    font-family: system-ui, -apple-system, sans-serif;
}

#robotForm .inputs {
    display: flex;
    gap: 2.5rem;
    margin-bottom: 2rem;
}

/* --- Left Side: Text Inputs --- */
#robotForm .text-inputs {
    flex: 1;
    display: flex;
    flex-direction: column;
    gap: 1.25rem;
}

#robotForm .text-inputs input[type="text"],
#robotForm .text-inputs input[type="number"],
#robotForm .text-inputs input[type="url"],
#robotForm .text-inputs textarea {
    width: 100%;
    box-sizing: border-box;
    font-size: 1rem;
    padding: 0.75rem 1rem;
    border: 1px solid #ccc;
    border-radius: 6px;
    transition: border-color 0.2s, box-shadow 0.2s;
    background-color: #fcfcfc;
}

#robotForm .text-inputs input:focus,
#robotForm .text-inputs textarea:focus {
    outline: none;
    border-color: #2563eb;
    box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.15);
}

#robotForm .text-inputs textarea {
    min-height: 120px;
    resize: vertical;
}

/* --- Radio Toggle (FRC / FTC) --- */
#robotForm .league-toggle {
    display: flex;
    border: 1px solid #ccc;
    border-radius: 6px;
    overflow: hidden;
    width: 100%;
}

#robotForm .text-inputs input[type="radio"] {
    display: none;
}

#robotForm .league-toggle label {
    flex: 1;
    text-align: center;
    padding: 0.75rem;
    cursor: pointer;
    background: #f3f4f6;
    color: #4b5563;
    font-weight: 600;
    transition: all 0.2s;
}

#robotForm .text-inputs input[type="radio"]:checked + label {
    background-color: #2563eb;
    color: white;
}

/* --- Right Side: File Upload Drop Zones --- */
#robotForm .file-inputs {
    flex: 1;
    display: flex;
    flex-direction: column;
    gap: 1.5rem;
}

#robotForm .field-group {
    display: flex;
    flex-direction: column;
    gap: 0.5rem;
}

#robotForm .field-label {
    font-weight: 600;
    color: #374151;
    font-size: 0.9rem;
}

/* --- Integrated Drop Zone Style --- */
#robotForm .drop-zone {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    width: 100%;
    height: 125px;
    border: 2px dashed #ccc;
    border-radius: 8px;
    cursor: pointer;
    position: relative;
    overflow: hidden;
    transition: background-color 0.3s, border-color 0.3s;
    box-sizing: border-box;
    background-color: #f9fafb;
}

#robotForm .drop-zone:hover {
    background-color: #f3f4f6;
    border-color: #2563eb;
}

#robotForm .drop-zone input[type="file"] {
    display: none;
}

#robotForm .drop-zone-text {
    font-size: 0.9rem;
    color: #4b5563;
    text-align: center;
    padding: 0 1rem;
    z-index: 2;
    mix-blend-mode: difference;
}

#robotForm .preview-img {
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    bottom: 0;
    width: 100%;
    height: 100%;
    z-index: 1;
    filter: saturate(0.5) brightness(0.7);
    background-size: cover;
    background-position: center;
    background-repeat: no-repeat;
}

/* --- Action Buttons --- */
#robotForm .btns {
    display: flex;
    justify-content: flex-end;
    gap: 1rem;
    border-top: 1px solid #e5e7eb;
    padding-top: 1.5rem;
}

#robotForm button {
    padding: 0.75rem 1.5rem;
    font-size: 1rem;
    font-weight: 600;
    border-radius: 6px;
    cursor: pointer;
    transition: background-color 0.2s;
}

#robotForm #submitBtn {
    background-color: #2563eb;
    color: white;
    border: none;
}

#robotForm #submitBtn:hover {
    background-color: #1d4ed8;
}

#robotForm #closeRobotModalBtn {
    background-color: transparent;
    color: #4b5563;
    border: 1px solid #d1d5db;
}

#robotForm #closeRobotModalBtn:hover {
    background-color: #f3f4f6;
}
    </style>
</head>
<body>
    
    <label for="robotImageInput" class="drop-zone">
        <input type="file" id="robotImageInput" accept=".png" required />
        <span class="drop-zone-text">Drop image here or click to upload</span>
        <div class="preview-img"></div>
    </label>

    <form id="robotForm">
        <div class="inputs">
            <div class="text-inputs">
                <input type="text" id="name" placeholder="Robot Name" required>
                <input type="number" id="year" placeholder="Year" required>

                <div class="league-toggle">
                    <input type="radio" id="frc" name="season" value="FRC" checked>
                    <label for="frc">FRC</label>

                    <input type="radio" id="ftc" name="season" value="FTC">
                    <label for="ftc">FTC</label>
                </div>

                <textarea id="description" placeholder="Description" required></textarea>
                <input type="url" id="githubLink" placeholder="GitHub URL">
            </div>

            <div class="file-inputs">
                <div class="field-group">
                    <span class="field-label">Robot Image (.png)</span>
                    <label for="imageFile" class="drop-zone" id="imageDropZone">
                        <input type="file" id="imageFile" accept=".png" required />
                        <span class="drop-zone-text">Drop image here or click to upload</span>
                        <div class="preview-img"></div>
                    </label>
                </div>

                <div class="field-group">
                    <span class="field-label">3D Model (.glb)</span>
                    <label for="modelFile" class="drop-zone" id="modelDropZone">
                        <input type="file" id="modelFile" accept=".glb" required />
                        <span class="drop-zone-text">Drop 3D model here or click to upload</span>
                        <div class="preview-img"></div>
                    </label>
                </div>
            </div>
        </div>
        <div class="btns">
            <button type="submit" id="submitBtn">Save Robot</button>
            <button type="button" id="closeRobotModalBtn">Cancel</button>
        </div>
    </form>

    <script>
        // --- Image Drop Zone Elements ---
        const imageFile = document.getElementById('imageFile');
        const imageDropZoneText = document.querySelector('#imageDropZone .drop-zone-text');
        const imagePreview = document.querySelector('#imageDropZone .preview-img');

        imageFile.addEventListener('change', () => {
            if (imageFile.files.length > 0) {
                const file = imageFile.files[0];
                imageDropZoneText.textContent = file.name;
                
                // Read and display image background preview
                const reader = new FileReader();
                reader.onload = (e) => {
                    imagePreview.style.backgroundImage = `url(${e.target.result})`;
                };
                reader.readAsDataURL(file);
            }
        });

        // --- Model Drop Zone Elements ---
        const modelFile = document.getElementById('modelFile');
        const modelDropZoneText = document.querySelector('#modelDropZone .drop-zone-text');

        modelFile.addEventListener('change', () => {
            if (modelFile.files.length > 0) {
                // Update text to show the selected .glb file name
                modelDropZoneText.textContent = modelFile.files[0].name;
            }
        });
    </script>
</body>
</html>
